<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UniGuide — Resetare parolă</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#1B2430; --paper:#EEF0F3; --paper-card:#FBFBFA; --gold:#E3A438; --gold-deep:#C6862A; --teal:#2C9C8F; --slate:#5B6472; --line:rgba(27,36,48,0.10); --coral:#E86A4F; }
  *{box-sizing:border-box;}
  body {
  margin: 0; 
  min-height: 100vh; 
  
  /* ALINIEREA PE CENTRU (Adăugată) */
  display: flex; 
  flex-direction: column; 
  justify-content: center; /* Centrează elementele pe verticală */
  align-items: center;     /* Centrează elementele pe orizontală */
  
  font-family: 'Inter', sans-serif;
  background: var(--paper);
  color: var(--ink);
  background-image: 
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 28px 28px;
  animation: driftGrid 45s linear infinite;
}

@keyframes driftGrid { 
  from { background-position: 0 0; } 
  to { background-position: 280px 280px; } 
}

  .card{ width:100%; max-width:380px; background:var(--paper-card); border:1px solid var(--line); border-radius:12px; padding:34px 32px; box-shadow:0 20px 50px rgba(27,36,48,0.14); }
  h1{ font-family:'Fraunces',serif; font-weight:600; font-size:22px; margin:0 0 6px; }
  p.sub{ color:var(--slate); font-size:13px; margin:0 0 22px; line-height:1.5; }
  label{ display:block; font-size:11px; font-weight:700; letter-spacing:.4px; text-transform:uppercase; color:var(--slate); margin-bottom:6px; }
  input{ width:100%; padding:11px 13px; border:1.5px solid var(--line); border-radius:7px; font-size:14px; margin-bottom:16px; }
  input:focus{ outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(227,164,56,0.18); }
  button{ width:100%; padding:12px; border:none; border-radius:7px; background:var(--ink); color:#fff; font-weight:700; font-size:14px; cursor:pointer; }
  button:hover{ background:#2A3644; }
  .message{ font-size:13px; font-weight:600; margin-top:14px; text-align:center; min-height:18px; }
  .ok{ color:var(--teal); } .err{ color:var(--coral); }
  a.back{ display:inline-block; margin-top:18px; font-size:12.5px; color:var(--slate); text-decoration:none; }
  a.back:hover{ color:var(--ink); }
</style>
</head>
<body>
  <div class="card">
    <h1>Ai uitat parola?</h1>
    <p class="sub">Introdu adresa de email cu care ți-ai făcut cont. Îți trimitem un link de resetare, valabil 15 minute.</p>
    <label>Email</label>
    <input type="email" id="email" placeholder="tu@exemplu.ro">
    <button onclick="trimite()">Trimite link de resetare</button>
    <div id="msg" class="message"></div>
    <a href="index.html" class="back">← Înapoi la autentificare</a>
  </div>

<script>
async function trimite(){
  const email = document.getElementById('email').value;
  const msg = document.getElementById('msg');
  if(!email){ msg.textContent = "Introdu un email."; msg.className='message err'; return; }

  try{
    const r = await fetch('http://localhost:8089/api/forgot-password', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ email })
    });
    const data = await r.json();
    msg.textContent = data.mesaj || data.eroare;
    msg.className = 'message ok';
  }catch(e){
    msg.textContent = "Serverul nu este pornit.";
    msg.className = 'message err';
  }
}
</script>
</body>
</html>
